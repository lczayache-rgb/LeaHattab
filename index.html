<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <!-- SEO -->

  <meta name="author" content="Léa Hattab" />

  <!-- Open Graph (réseaux sociaux) -->
  <meta property="og:title" content="Léa Hattab — Graphic &amp; UX/UI Designer" />
  <meta property="og:description" content="Portfolio de Léa Hattab, Graphic &amp; UX/UI Designer." />
  <meta property="og:type" content="website" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Kumbh+Sans:wght@300;400;500;600&family=Homemade+Apple&family=Assistant:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>

  <!-- Point d'entrée de l'application -->
  <div id="app">
    <!-- Chargement initial -->
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Montserrat',sans-serif;font-weight:300;font-size:16px;letter-spacing:4px;text-transform:uppercase;color:#797c7f;">
      Chargement...
    </div>
  </div>

  <!-- Données du site (à modifier dans src/data/) -->
  <script src="/src/data/siteContent.js"></script>
  <script src="/src/data/projects.js"></script>

  <!-- Composants -->
  <script src="/src/components/header.js"></script>
  <script src="/src/components/footer.js"></script>

  <!-- Pages -->
  <script src="/src/pages/home.js"></script>
  <script src="/src/pages/work.js"></script>
  <script src="/src/pages/project.js"></script>

  <!-- Application principale (routeur) -->
  <script>
    // GitHub Pages SPA : restaure l'URL depuis la redirection 404
    (function() {
      var params = new URLSearchParams(window.location.search);
      var redirect = params.get('redirect');
      if (redirect) {
        params.delete('redirect');
        var search = params.toString();
        var url = redirect + (search ? '?' + search : '') + window.location.hash;
        window.history.replaceState(null, '', url);
      }
    })();
  </script>
  <script src="/src/app.js"></script>

</body>
</html>
