<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Léa Hattab — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Caveat:wght@400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #eeebe4;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .logo {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 80px;
    }
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(56px, 10vw, 110px);
      line-height: 0.9;
      margin-bottom: 4px;
    }
    .name-script {
      font-family: 'Caveat', cursive;
      font-weight: 400;
      font-size: clamp(56px, 10vw, 110px);
      line-height: 1;
    }
    .line {
      width: 40px;
      height: 1px;
      background: #888;
      margin: 40px auto;
    }
    .tagline {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 60px;
    }
    .coming {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(18px, 2.5vw, 24px);
      font-weight: 300;
      color: #444;
      margin-bottom: 40px;
    }
    .email {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid #111;
      padding-bottom: 2px;
    }
    .footer {
      position: fixed;
      bottom: 24px;
      font-size: 10px;
      color: #aaa;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="logo">L.H</div>
  <div>
    <div class="name">Léa</div>
    <div class="name-script">Hattab</div>
  </div>
  <div class="line"></div>
  <div class="tagline">Graphic &amp; UX/UI Designer</div>
  <p class="coming">Something beautiful is coming soon.</p>
  <a href="mailto:lczayache@gmail.com" class="email">lczayache@gmail.com</a>
  <div class="footer">© 2026 Léa Hattab</div>
</body>
</html>
