  <link rel="stylesheet" href="/src/styles/main.css" />
  <script>
    // GitHub Pages SPA trick : redirige vers index.html avec le path en paramètre
    // puis index.html lit ce paramètre pour restaurer la vraie URL
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    // Redirige vers index.html en encodant le path dans l'URL
    window.location.replace(
      '/?redirect=' + encodeURIComponent(path) +
      (search ? '&' + search.slice(1) : '') +
      hash
    );
  </script>
</head>
